name: Unpack project to branch
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  unpack:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Extract zip and push as branch unity-project
        run: |
          unzip -q ShadowFire_Unity.zip -d /tmp/x
          git checkout --orphan unity-project
          git rm -rf . > /dev/null
          cp -r /tmp/x/ShadowFire/. .
          rm -rf .github
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add -A
          git commit -m "Unity project (unpacked)"
          git push -f origin unity-project
