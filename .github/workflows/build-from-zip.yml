name: Build APK from zip
on:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Unpack project from zip
        run: |
          unzip -q ShadowFire_Unity.zip
          cp -r ShadowFire/. .
      - name: Enable Unity error annotations
        run: echo "::add-matcher::.github/unity-matcher.json"
      - name: Build APK
        id: build
        uses: game-ci/unity-builder@v4
        continue-on-error: true
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
        with:
          targetPlatform: Android
          unityVersion: 2022.3.45f1
          androidExportType: androidPackage
          buildMethod: ShadowFire.EditorTools.CIBuild.Android
      - name: Upload APK
        if: steps.build.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: ShadowFire-apk
          path: build/Android
      - name: Fail if build failed
        if: steps.build.outcome == 'failure'
        run: exit 1
